apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: limitry
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: datastore
    app.kubernetes.io/part-of: limitry
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: datastore
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
