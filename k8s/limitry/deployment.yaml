apiVersion: apps/v1
kind: Deployment
metadata:
  name: limitry
  namespace: limitry
  labels:
    app.kubernetes.io/name: limitry
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: limitry
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: limitry
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: limitry
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: limitry
    spec:
      containers:
        - name: limitry
          image: ghcr.io/fares7elsadek/limitry:1.0.0
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/limitry/config.yaml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/limitry
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: limitry-config
