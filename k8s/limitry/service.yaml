apiVersion: v1
kind: Service
metadata:
  name: limitry
  namespace: limitry
  labels:
    app.kubernetes.io/name: limitry
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: limitry
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: limitry
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 8000
      targetPort: metrics
      protocol: TCP
