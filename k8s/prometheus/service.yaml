apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: limitry
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: limitry
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
  ports:
    - name: http
      port: 9090
      targetPort: http
      protocol: TCP
