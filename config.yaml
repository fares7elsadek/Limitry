mode: proxy   # or "check"

backend:
  url: "http://localhost:9000"

redis:
  addr: "localhost:6379"
  fail_mode: open   # or "closed" — behavior if Redis is unreachable

routes:
  - path: "/api/orders"
    algorithm: token_bucket
    limit: 100
    window: 60s
  - path: "/api/search"
    algorithm: sliding_window
    limit: 20
    window: 10s

metrics:
  enabled: true
  port: 9090